<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Reibax ©" >
    <meta name="description" content="dive point exploration" >
    <link rel="icon" href="img/logo.png" type="logo/image">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
    <title>The Dive Bridge</title>
</head>
<body>
    <header class="header">
        
        <div class="header__image">
            <img src="img/logo.png" class="header__image-logo" alt="logo/image">
        </div>

        <div class="header__title">
            <h1>The Dive Bridge <br><span>Scuba Point Exploration</span></h1>
        </div>

        <div class="nav">
            <a href="index.html">Explore</a>
            <a href="favorite.html">Favorite</a>
        </div>

    </header>
    <section class="form__front">
        <form action="" id="diveSpot-form">
            <fieldset class="diveSpot-form-fieldset">
                <legend class="diveSpot-form-legend">Search your Dive Point</legend>

                <input type="search" id="diveSpot-name" placeholder="Search Your Dive Spot">

                <select name="" id="diveSpot-country" >
                    <option value="" class="diveSpot-country-text">All Countries</option>
                </select>

                <select name="" id="diveSpot-level">
                    <option value="all">All Levels</option>
                    <option value="open-water">Open Water</option>
                    <option value="advance">Advance</option>
                    <option value="divemaster">Divemaster</option>
                    <option value="technical">Technical Dive</option>
                </select> 

                <button id="diveSpot-button" type="submit">SEARCH</button>
            </fieldset>
        </form>

        <section id="paginator">

            <button id="prev-button" disabled type="button">PREV</button>

            <p id="page-info">PAGE: <span id="current-page">1</span>  🤿  <span id="total-pages">1</span></p>

            <button id="next-button" type="button">NEXT</button>

        </section>      <!-- paginator -->
    </section>    <!-- "form__front" -->
    <main>

        <section id="diveSpot-list" ></section>
    </main>
        <footer class="footer">
            <div class="footer__content">
                <img src="img/images.jpeg" alt="footer/image" class="footer__content-img">
            </div>

            <div class="copyright">
                <p>All Rights Rerserved to Reibax &copy;</p>
            </div>
        </footer>
<script type="module" src="src/index.js"></script>
</body>
</html>
